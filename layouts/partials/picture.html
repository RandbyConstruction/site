<article style="display: flex; align-items: center">
    <a href="{{ .image }}" class="image">
    <img src="{{ .thumb }}" style="transform: rotate({{ .transform }}deg)" alt="" />
    </a>
    <div class="caption">
        <h3>{{ .title }}</h3>
        <p>{{ .content }}</p>
        <ul class="actions fixed">
            <li><span class="button small">{{ .button }}</span></li>
        </ul>
    </div>
</article>
